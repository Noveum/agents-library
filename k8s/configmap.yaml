# ConfigMap for AI Agents Library API configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-api-config
  namespace: agents-library
  labels:
    app: agents-api
    component: config
data:
  # LLM Configuration
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-3.5-turbo"
  LLM_TEMPERATURE: "0.7"
  LLM_MAX_TOKENS: "2000"
  LLM_TIMEOUT: "30"
  
  # Memory Configuration
  MEMORY_TYPE: "buffer"
  MEMORY_MAX_MESSAGES: "20"
  MEMORY_MAX_TOKENS: "4000"
  MEMORY_PERSIST: "false"
  
  # Noveum Configuration
  NOVEUM_ENABLED: "true"
  NOVEUM_PROJECT: "agents-library-k8s"
  NOVEUM_ENVIRONMENT: "production"
  NOVEUM_SAMPLE_RATE: "1.0"
  
  # API Configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  
  # Agent Configuration
  AGENT_NAME: "API Agent"
  MAX_RESPONSE_TOKENS: "1000"

