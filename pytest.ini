[tool:pytest]
# Pytest configuration for AI Agents Library

# Test discovery
testpaths = src/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests
    
# Minimum version
minversion = 7.0

# Test timeout (in seconds)
timeout = 300

# Async support
asyncio_mode = auto

# Coverage options (if pytest-cov is installed)
# addopts = --cov=api --cov=shared-components --cov-report=html --cov-report=term-missing

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:aiohttp.*

